general {
    hide_cursor        = true
    ignore_empty_input = true
    immediate_render   = true
}

background {
    monitor     =
    color       = rgb(0,0,0)
    reload_time = 0
}

animations {
    enabled = false
}

input-field {
    monitor   =
    size      = 25%, 5%

    font_family = FiraMono Nerd Font

    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    hide_input = false
    fade_on_empty = false

    inner_color = rgb(7,112,0)
    outline_thickness = 0
    font_color = rgb(0,0,0)
    rounding = 0

    check_color = rgb(144,0,255)
    placeholder_text = <i>password...</i>
    fail_color = rgb(128,0,0)
    fail_text = <i>incorrect password</i>

    invert_numlock = false
    swap_font_color = false

    position = 0%, 0%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo $(date +"%H:%M:%S") \| $(tr '[:upper:]' '[:lower:]' </sys/class/power_supply/BAT1/status) @ $(</sys/class/power_supply/BAT1/capacity)%
    color = rgb(0,0,0)
    position = 0%, 1.5%
    font_size = 10
    font_family = FiraMono Nerd Font
}
